<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Dev-server value. `scripts/prerender.mjs` replaces this with the route's
      own title, and fails the build if this tag is missing — it was silently
      deleted once, which shipped every page without a title.
    -->
    <title>Pooja Singhal — Product Designer</title>
    <!--
      The font faces are pulled in by @import from `src/styles/index.css`, so
      the browser cannot discover fonts.gstatic.com until that stylesheet has
      been fetched and parsed. Opening the connection up front removes a full
      DNS + TLS round trip from the critical path.
    -->
    <!--
      Every font the design uses is declared as an explicit @font-face alias in
      `src/styles/_fonts.css`, pointing straight at a woff2 on one of these two
      hosts. There is no third-party stylesheet to fetch first.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://static.figma.com" crossorigin />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
